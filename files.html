<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Video Content Manager</title>
  <!-- Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" 
    crossorigin="anonymous"
  >
  <!-- Lucide React Icons -->
  <script src="https://unpkg.com/lucide-react@0.244.0/dist/lucide-react.umd.min.js"></script>
  <style>
    body, html {
      height: 100%;
    }
    .scroll-area {
      overflow: auto;
      flex-grow: 1;
    }
    .card-hover:hover {
      cursor: pointer;
      background-color: #f8f9fa;
    }
    .selected {
      border: 2px solid #0d6efd !important;
    }
    .thumbnail {
      width: 80px;
      height: 60px;
      object-fit: cover;
      margin-right: 15px;
    }
    .icon-button {
      display: flex;
      align-items: center;
    }
    .icon-button svg {
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React and ReactDOM -->
  <script 
    src="https://unpkg.com/react@18/umd/react.development.js" 
    crossorigin
  ></script>
  <script 
    src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" 
    crossorigin
  ></script>
  <!-- Babel for JSX transformation -->
  <script 
    src="https://unpkg.com/@babel/standalone/babel.min.js"
  ></script>
  <!-- Bootstrap JS (для тултипов) -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" 
    crossorigin="anonymous"
  ></script>

  <!-- Main React Component -->
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createRoot } = ReactDOM;
    const { 
      Search, Upload, Edit, Trash2, Play, Pause, RotateCcw, 
      Folder, ChevronRight, ChevronUp, Plus, Info 
    } = LucideReact;

    function VideoContentManager() {
      const [rootFolder, setRootFolder] = useState({
        id: 'root',
        name: 'Корневая папка',
        items: [
          {
            id: 'folder1',
            name: 'Рекламные ролики',
            items: [
              { id: '1', title: 'Рекламный ролик 1', duration: '00:30', thumbnail: 'https://via.placeholder.com/120x80' },
              { id: '2', title: 'Рекламный ролик 2', duration: '00:45', thumbnail: 'https://via.placeholder.com/120x80' },
            ]
          },
          {
            id: 'folder2',
            name: 'Новости',
            items: [
              { id: '3', title: 'Новостной выпуск 1', duration: '15:00', thumbnail: 'https://via.placeholder.com/120x80' },
              { id: '4', title: 'Новостной выпуск 2', duration: '12:30', thumbnail: 'https://via.placeholder.com/120x80' },
            ]
          },
          { id: '5', title: 'Интервью с экспертом', duration: '05:45', thumbnail: 'https://via.placeholder.com/120x80' },
        ]
      });

      const [currentPath, setCurrentPath] = useState(['root']);
      const [selectedItem, setSelectedItem] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');

      const getCurrentFolder = () => {
        let current = rootFolder;
        for (const id of currentPath.slice(1)) {
          current = current.items.find(item => item.items && item.id === id);
          if (!current) break;
        }
        return current;
      };

      const currentFolder = getCurrentFolder();

      const filteredItems = currentFolder.items.filter(item => 
        item.title ? item.title.toLowerCase().includes(searchTerm.toLowerCase()) :
        item.name.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const handleItemClick = (item) => {
        if (item.items) {
          setCurrentPath([...currentPath, item.id]);
          setSelectedItem(null);
        } else {
          setSelectedItem(item);
        }
      };

      const handleBreadcrumbClick = (index) => {
        setCurrentPath(currentPath.slice(0, index + 1));
        setSelectedItem(null);
      };

      const handleNewFolder = () => {
        const newFolder = {
          id: `folder${Date.now()}`,
          name: 'Новая папка',
          items: []
        };
        setRootFolder(prevRoot => {
          const newRoot = { ...prevRoot };
          let current = newRoot;
          for (const id of currentPath.slice(1)) {
            current.items = current.items.map(item => item.id === id ? { ...item } : item);
            current = current.items.find(item => item.id === id);
          }
          current.items = [...current.items, newFolder];
          return newRoot;
        });
      };

      const handleGoUp = () => {
        if (currentPath.length > 1) {
          setCurrentPath(currentPath.slice(0, -1));
          setSelectedItem(null);
        }
      };

      useEffect(() => {
        // Инициализация тултипов Bootstrap
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        tooltipTriggerList.map(function (tooltipTriggerEl) {
          return new bootstrap.Tooltip(tooltipTriggerEl)
        })
      }, [currentPath, selectedItem]);

      return (
        <div className="d-flex h-100">
          {/* Sidebar */}
          <div className="w-1/3 p-4 border-end d-flex flex-column">
            {/* Поиск */}
            <div className="mb-4">
              <input 
                type="search" 
                className="form-control" 
                placeholder="Поиск видео..." 
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
              />
            </div>
            {/* Breadcrumb */}
            <nav aria-label="breadcrumb" className="mb-4">
              <ol className="breadcrumb">
                {currentPath.map((path, index) => (
                  <li 
                    key={path} 
                    className={`breadcrumb-item ${index === currentPath.length -1 ? 'active' : ''}`} 
                    aria-current={index === currentPath.length -1 ? "page" : undefined}
                    style={{cursor: index !== currentPath.length -1 ? 'pointer' : 'default'}}
                    onClick={() => index !== currentPath.length -1 && handleBreadcrumbClick(index)}
                  >
                    {index === 0 ? 'Корневая папка' : rootFolder.items.find(item => item.id === path)?.name || 'Корневая папка'}
                  </li>
                ))}
              </ol>
            </nav>
            {/* Scroll Area */}
            <div className="scroll-area mb-4 flex-grow">
              {currentPath.length > 1 && (
                <div 
                  className="card mb-2 card-hover"
                  onClick={handleGoUp}
                >
                  <div className="card-body d-flex align-items-center">
                    <ChevronUp className="me-3" size={24} />
                    <span>...</span>
                  </div>
                </div>
              )}
              {filteredItems.map(item => (
                <div 
                  key={item.id} 
                  className={`card mb-2 card-hover ${selectedItem?.id === item.id ? 'selected' : ''}`}
                  onClick={() => handleItemClick(item)}
                >
                  <div className="card-body d-flex align-items-center">
                    {item.items ? (
                      <Folder className="me-3" size={24} />
                    ) : (
                      <img src={item.thumbnail} alt={item.title} className="thumbnail" />
                    )}
                    <div>
                      <h5 className="card-title mb-1">
                        {item.items ? item.name : item.title}
                      </h5>
                      {item.duration && <p className="card-text text-muted">{item.duration}</p>}
                    </div>
                    {item.items && <span className="ms-auto"><ChevronRight size={24} /></span>}
                  </div>
                </div>
              ))}
            </div>
            {/* Folder Info */}
            <div className="card">
              <div className="card-body">
                <h5 className="card-title d-flex align-items-center">
                  <Info className="me-2" size={20} />
                  Информация о текущей папке
                </h5>
                <p className="card-text">Название: {currentFolder.name}</p>
                <p className="card-text">Количество элементов: {currentFolder.items.length}</p>
                <p className="card-text">Путь: {currentPath.join(' / ')}</p>
              </div>
            </div>
          </div>
          {/* Main Content */}
          <div className="flex-grow p-4 d-flex flex-column">
            {/* Action Buttons */}
            <div className="d-flex justify-content-between mb-4">
              <button 
                className="btn btn-primary d-flex align-items-center me-2" 
                onClick={handleNewFolder}
                data-bs-toggle="tooltip" 
                data-bs-placement="top" 
                title="Создать новую папку"
              >
                <Plus className="me-2" size={16} /> Новая папка
              </button>
              <button 
                className="btn btn-secondary d-flex align-items-center" 
                data-bs-toggle="tooltip" 
                data-bs-placement="top" 
                title="Загрузить новое видео"
              >
                <Upload className="me-2" size={16} /> Загрузить видео
              </button>
            </div>
            {/* Content Area */}
            {selectedItem ? (
              <div className="flex-grow overflow-auto">
                <div className="ratio ratio-16x9 mb-4">
                  <img src={selectedItem.thumbnail} alt={selectedItem.title} className="img-fluid object-contain bg-dark" />
                </div>
                <h2 className="mb-2">{selectedItem.title}</h2>
                <p className="text-muted mb-4">Продолжительность: {selectedItem.duration}</p>
                <div className="mb-4">
                  <button className="btn btn-primary me-2 d-flex align-items-center">
                    <Play className="me-2" size={16} /> Воспроизвести
                  </button>
                  <button className="btn btn-outline-secondary me-2 d-flex align-items-center">
                    <Pause className="me-2" size={16} /> Пауза
                  </button>
                  <button className="btn btn-outline-secondary d-flex align-items-center">
                    <RotateCcw className="me-2" size={16} /> Перемотать
                  </button>
                </div>
                <div>
                  <button className="btn btn-outline-primary me-2 d-flex align-items-center">
                    <Edit className="me-2" size={16} /> Редактировать
                  </button>
                  <button className="btn btn-danger d-flex align-items-center">
                    <Trash2 className="me-2" size={16} /> Удалить
                  </button>
                </div>
              </div>
            ) : (
              <div className="d-flex flex-grow-1 align-items-center justify-content-center text-muted">
                Выберите видео для просмотра деталей
              </div>
            )}
          </div>
        </div>
      );
    }

    // Render the component
    createRoot(document.getElementById('root')).render(<VideoContentManager />);
  </script>
</body>
</html>
